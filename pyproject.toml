[project]
name = "cinebook-mongodb-kafka-cdc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.16.1",
    "faker>=40.44.0",
    "fastapi>=0.162.0",
    "pydantic>=2.14.3",
    "pymongo>=4.19.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pyrefly]
python-interpreter-path = ".venv/bin/python"
